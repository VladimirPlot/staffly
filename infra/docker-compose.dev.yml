version: "3.9"

services:
  db:
    image: postgres:16
    container_name: staffly-db
    environment:
      POSTGRES_DB: staffly
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  backend:
    build:
      context: ../backend
    container_name: staffly-backend
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/staffly
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: app

      JWT_SECRET: dev-very-secret-key-change-me-32+chars-long!!_0123456789
      ACCESS_TTL_MINUTES: 15
      REFRESH_TTL_DAYS: 30

      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}

      # ✅ S3 (Yandex Object Storage)
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL}
      S3_PUBLIC_BUCKET: ${S3_PUBLIC_BUCKET}
      S3_PRIVATE_BUCKET: ${S3_PRIVATE_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}

    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "3", "http://127.0.0.1:8080/api/ready"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy

  backend-worker:
    build:
      context: ../backend
    container_name: staffly-backend-worker
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: dev,worker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/staffly
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: app

      JWT_SECRET: dev-very-secret-key-change-me-32+chars-long!!_0123456789
      ACCESS_TTL_MINUTES: 15
      REFRESH_TTL_DAYS: 30

      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}

      # ✅ S3 (Yandex Object Storage)
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL}
      S3_PUBLIC_BUCKET: ${S3_PUBLIC_BUCKET}
      S3_PRIVATE_BUCKET: ${S3_PRIVATE_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}

    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy

volumes:
  pgdata:
